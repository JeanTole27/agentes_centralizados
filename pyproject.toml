[project]
name = "ops-central"
version = "0.1.0"
description = "Ops Central: interfaz única de operación para Capa Media y Base de Datos"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "pyjwt>=2.8",
    "httpx>=0.27",
    "numpy>=2.0",
]

[project.optional-dependencies]
# Producción: base de datos, Oracle y SSO
prod = [
    "psycopg[binary]>=3.2",
    "oracledb>=4.0.1",
    "authlib>=1.3",
]
dev = ["pytest>=8"]

[project.scripts]
ops-central = "opscentral.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
