# Ops Central — configuración de ejemplo.
# Copiar a config/ops-central.toml (o indicar la ruta con OPS_CENTRAL_CONFIG).
# Ninguna clave va en este archivo: solo REFERENCIAS a rutas del gestor de secretos (*_ref).

[general]
modo = "desarrollo"          # desarrollo | produccion

[almacen]
url = "sqlite:///datos/ops-central.db"
# Producción: url = "postgresql+psycopg://ops_central@pg-ops:5432/ops_central"  (clave en secretos: almacen/postgres)

[evidencia]
ruta = "datos/evidencia"     # Producción: almacén de objetos con retención (S3 Object Lock o recurso compartido)

[auth]
proveedor = "demo"           # demo: registro con nombre + perfil, sin contraseña (solo desarrollo) | dev | oidc | ldaps
inactividad_min = 30
duracion_max_h = 8
stepup_vigencia_min = 5      # MFA reciente exigido para aprobar clase C o ejecutar en PROD
intentos_max = 5             # solo LDAPS
bloqueo_min = 15

[auth.grupos]                # grupo de AD -> perfil de Ops Central
GG_OPS_DBA = "dba"
GG_OPS_CM = "cm"
GG_OPS_LIDER = "lid"
GG_OPS_CONSULTA = "con"
GG_OPS_ADMIN = "adm"

[auth.oidc]
issuer = "https://login.microsoftonline.com/<tenant>/v2.0"
client_id = "<client-id>"
client_secret_ref = "auth/oidc_client_secret"
redirect_uri = "https://ops-central.empresa.local/api/auth/oidc/callback"
claim_grupos = "groups"
acr_mfa = ["mfa", "http://schemas.microsoft.com/claims/multipleauthn"]

[aprobaciones]
clave_firma_ref = "ops/firma_aprobaciones"
vigencia_min = 120
aprobacion_c_no_prod = true  # clase C pide segunda persona también fuera de PROD
ejecucion_directa = true     # quien tiene permiso 'ejecuta' ejecuta sin cola de aprobación (BD y Capa Media); queda en el log
exigir_referencia_prod = false  # true: los cambios en PROD/DRP exigen un caso asociado (por defecto es opcional)
motivo_obligatorio_c = false    # true: las acciones de clase C exigen escribir un motivo (por defecto es opcional)

[jira]
# Casos opcionales: si una ejecución se asocia a un caso, se trae de Jira para completar los datos.
url = ""                     # p. ej. https://empresa.atlassian.net (vacío = Jira deshabilitado)
credencial_ref = "jira/api"  # secreto con {"usuario": "<correo>", "token": "<api token>"}
jql_abiertos = "statusCategory != Done ORDER BY updated DESC"
max_resultados = 25
verificar_tls = true

[jira.campos]                # parámetro de la acción -> campo de Jira (opcional; si falta se busca en el texto)
# base = "customfield_10050"
# host = "customfield_10051"

[asistente]
# Ventana de chat del asistente operativo (RAG de runbooks e incidentes + consultas de solo lectura).
# Mientras habilitado = false (o url vacío) la ventana aparece y registra las preguntas, pero responde
# "no conectado". Nunca ejecuta acciones: solo sugiere ir a la pantalla o abrir el formulario de la acción.
habilitado = false
url = ""                         # endpoint del motor (pendiente)
motor = ""                       # nombre informativo del motor
credencial_ref = "asistente/api"
timeout_s = 60
max_caracteres = 2000

[secretos]
proveedor = "archivo"        # archivo (solo desarrollo) | vault
archivo = "config/secretos.dev.json"
vault_url = "https://vault.empresa.local:8200"
vault_kv = "secret"          # montaje KV v2
vault_ssh = "ssh-client-signer"
vault_ssh_rol = "ops-central-cm"

[reportes]
# HTML de los reportes bd.rep.* (uno por ejecución, con su SHA-256 en el resultado)
ruta = "datos/reportes"

[bd]
cuenta_consulta = "OPS_CONSULTA"
cuenta_dba = "OPS_DBA"
paquete = "ADMINBD.PKG_OPS_CENTRAL"
call_timeout_s = 20
max_paralelo = 10
sesiones_por_base = 1
refresco_min_s = 120
circuito_fallos = 3
circuito_espera_s = 600
ruta_kit_oracle = "../oracle-agent-kiro-master"
# Oracle Instant Client (modo thick). Vacío = modo thin (sin cliente).
# Hace falta si las bases usan Native Network Encryption o son versiones antiguas (errores DPY-3010 / DPY-3001).
# Ruta absoluta o relativa a ops-central. Si se deja vacío se usa la variable ORACLE_CLIENT_DIR.
# Ejemplo Windows (comillas simples para no escapar las barras):
# oracle_client_dir = 'C:\oracle\instantclient_23_9'
oracle_client_dir = ""
# Demo sin Oracle: los reportes bd.rep.* se generan con DATOS DE MUESTRA (marcados en el HTML).
# Con Oracle disponible ponerlo en false. Producción lo rechaza.
reportes_muestra = true

[cm]
ruta_cmops = "capa-media-ops"   # copia incluida en el proyecto; otra ruta solo si se usa una instalación aparte
python_cmops = "python"      # en el servidor: python3 (3.6+)
ttl_certificado_min = 10
timeout_s = 3600

[zabbix]
url = "https://zabbix.empresa.local/api_jsonrpc.php"
token_ref = "zabbix/token_lectura"
secreto_webhook_ref = "zabbix/secreto_webhook"
servidor_trapper = "zabbix.empresa.local"
puerto_trapper = 10051
ventana_episodio_min = 15
verificar_tls = true          # o la ruta al certificado de la CA interna; false solo en pruebas
timeout_s = 30
user_agent = "OpsCentral/0.1" # si un WAF interno bloquea clientes que no reconoce, poner aquí el UA permitido
severidad_min = 2             # problemas desde "warning" para el respaldo del webhook
dias_trends = 30              # historia que se trae la primera vez; luego es incremental
max_items_host = 40           # tope de series de capacidad por servidor
# Token de API (Users > API tokens) de un usuario de SOLO LECTURA: va en el gestor de secretos
# bajo token_ref, nunca en este archivo. Prueba de conexión: python -m opscentral zabbix-probar

[ml]
umbrales = [85, 95, 100]
ventana_dias = 14
min_puntos = 24

[inventario]
archivo = "config/inventario.json"   # lo escribe: python -m opscentral generar-inventario
# Quién puede dar de alta, editar o dar de baja activos desde la pantalla Inventario.
# Vacío = todos los perfiles (modo demo). Luego: editores = ["login.de.la.persona"]
editores = []
# Otras copias de databases.json con bases que el kit principal no tiene (p. ej. DESA). Se agregan
# solo los alias nuevos. Relativas a ops-central.
bases_adicionales = ["../../hoja_de_vida_portable-main/hoja_de_vida_portable-main/config/databases.json"]

[inventario.insumos]
servidores_cm = "../capa-media-ops/inventario/servidores.json"   # insumo original: solo para regenerar config/inventario.json
bases         = "../oracle-agent-kiro-master/config/databases.json"
bases_csv     = "../oracle-agent-kiro-master/docs/databases.csv"
mapa_oracle   = "../zabbix-capacity-mcp-main/capacity-watchdog/config/oracle_map.yaml"
relaciones    = "config/relaciones.json"   # opcional: [{"dominio": "...", "base": "...", "datasource": "..."}]
